# rumdl configuration. Replaces .markdownlint-cli2.jsonc and .markdownlintignore.
# Lint everything with: mise run lint   (or: rumdl check .)

[global]
# Same rules switched off as the markdownlint-cli2 config this replaces.
disable = ["MD060", "MD032", "MD013", "MD022", "MD024", "MD031", "MD037", "MD040", "MD047"]

# Markdown only; rumdl also lints .mdx by default and the old gate never did.
include = ["**/*.md"]

exclude = [
  # Generated by docs/scripts/prelink.mjs: transformed copies.
  "docs/src/content/docs/skills/**",
  "skills/documentation/markdown-authoring/references/**",
  ".context/**",
  # Machine-written audit reports and evals.
  "skills/**/.audits/**",
  "skills/**/evals/**",
  "skills/agentic-harness/opencode-toolkit/build-plugins/references/**",
  "skills/agentic-harness/opencode-toolkit/design-agents/references/**",
  "skills/agentic-harness/opencode-toolkit/configure/references/**",
  # Golden-corpus fixtures: copied third-party testdata and deliberately
  # malformed boundary cases, not authored docs.
  "crates/*/tests/golden-corpus/fixtures/**",
  # Vendored ansible test fixtures and root-level evals.
  "skills/infrastructure/ansible/validator/assets/test/**",
  "evals/**",
  # Generated file: contains intentional inline HTML for badge spans.
  "docs/src/content/docs/tiles.md",
]

[MD010]
code-blocks = false

# Left as written, rule by rule, because the ADR tool owns their format: it
# writes a single H1 under a front-matter title, and its tests expect that.
[per-file-ignores]
"docs/adr/consolidate-adr-tooling.md" = ["MD025", "MD064"]
"crates/adr/docs/design/agent-driven-adr-lifecycle.md" = ["MD028", "MD033", "MD064"]
