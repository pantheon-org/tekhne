[tools]
rust = "1.96.1"
node = "lts"
bun = "latest"
yq = "latest"
jq = "latest"
shellcheck = "latest"
hk = "latest"
pkl = "latest"
# rumdl is pre-1.0, so a minor bump can add rules and change what the lint gate
# reports. Pinned exactly (unlike the other linters), bumped on purpose.
rumdl = "0.2.77"
cargo-dist = "0.32.0"

[settings]
# Refuse tool releases younger than a week when resolving versions.
minimum_release_age = "7d"

[env]
# Wrap hk-invoked git hooks in `mise x` so pinned tools (bun, node, yq,
# shellcheck, rumdl, rust/cargo) are on PATH without shell activation.
HK_MISE = "1"

[hooks]
# After tools are installed, wire up the git hooks (idempotent).
postinstall = "hk install"
# On entering the project, ensure deps are installed. On first run this
# triggers postinstall (which installs the git hooks); afterwards it is a
# no-op since the tools are already present.
enter = "mise install -q"

[tasks.setup]
description = "Install project dependencies and git hooks"
run = ["bun install", "hk install"]

# Lint all markdown directly (git-independent; covers gitignored paths too)
[tasks.lint]
run = "rumdl check ."

[tasks.lint-fix]
run = "rumdl check --fix ."

# Zip a skill directory for upload (e.g. to claude.ai), dereferencing any
# symlinks so the archive contains only real files.
# Usage: mise run zip-skill -- /full/path/to/skills/<domain>/<skill-name>
[tasks.zip-skill]
description = "Zip a skill directory for upload, dereferencing symlinks"
run = "./scripts/zip-skill.sh"

# Cargo builds for the crate-distributed skill tools (see AGENTS.md § Skills
# distributed via crate installers). mise already pins the rust toolchain
# these build against, so the build step lives here rather than in package.json.
[tasks."build:skill-auditor"]
description = "Build the pantheon-skill-auditor CLI from source"
run = "cargo build --release -p pantheon-skill-auditor"

[tasks."build:adr"]
description = "Build the pantheon-adr CLI from source"
run = "cargo build --release -p pantheon-adr"

[tasks."build:journal"]
description = "Build the pantheon-journal CLI from source"
run = "cargo build --release -p pantheon-journal"

[tasks."audit:skill"]
description = "Build pantheon-skill-auditor from source and run it (pass skill args after --)"
run = ["cargo build --release -q -p pantheon-skill-auditor", "target/release/pantheon-skill-auditor evaluate"]

# Build a crate-distributed skill tool from the working tree and install its
# skill from that build, instead of waiting on the PR -> merge -> release loop
# for a released binary to pick up a SKILL.md edit (see AGENTS.md).
[tasks."install-skill:adr"]
description = "Build pantheon-adr from source and install its skill from that build"
run = ["cargo build --release -q -p pantheon-adr", "target/release/pantheon-adr skill install"]

[tasks."install-skill:journal"]
description = "Build pantheon-journal from source and install its skill from that build"
run = ["cargo build --release -q -p pantheon-journal", "target/release/pantheon-journal skill install"]

[tasks."install-skill:skill-auditor"]
description = "Build pantheon-skill-auditor from source and install its skill from that build"
run = ["cargo build --release -q -p pantheon-skill-auditor", "target/release/pantheon-skill-auditor skill install"]
