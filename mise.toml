[tools]
node = "lts"
bun = "latest"
yq = "latest"
jq = "latest"
shellcheck = "latest"
hk = "latest"
pkl = "latest"
# rumdl is pre-1.0, so a minor bump can add rules and change what the lint gate
# reports. Pinned exactly (unlike the other linters), bumped on purpose.
rumdl = "0.2.77"
# The pantheon-skill-auditor release (scoring, validate, check, probes, analyze)
# used by the git hooks and the Skill Audit and Stored Audits workflows. Exact
# version: bump it on purpose, together with VERSION and SHA256 in
# .github/actions/install-skill-auditor/action.yml and the linux-x64 checksum in
# mise.lock. Released from pantheon-org/pantheon-skill-auditor on plain v tags.
"github:pantheon-org/pantheon-skill-auditor" = "0.3.1"
# Lints skill frontmatter and agent files (Claude Code semantics, leaked
# tool-call markup). Keep in sync with AGNIX_VERSION in .github/workflows/agnix.yml.
"github:agent-sh/agnix" = "0.56.6"

[settings]
# Refuse tool releases younger than a week when resolving versions.
minimum_release_age = "7d"

[env]
# Wrap hk-invoked git hooks in `mise x` so pinned tools (bun, node, yq,
# shellcheck, rumdl) are on PATH without shell activation.
HK_MISE = "1"

[hooks]
# After tools are installed, wire up the git hooks (idempotent).
postinstall = "hk install"
# On entering the project, ensure deps are installed. On first run this
# triggers postinstall (which installs the git hooks); afterwards it is a
# no-op since the tools are already present.
enter = "mise install -q"

[tasks.setup]
description = "Install project dependencies and git hooks"
run = ["bun install", "hk install"]

# Lint all markdown directly (git-independent; covers gitignored paths too)
[tasks.lint]
run = "rumdl check ."

[tasks.lint-fix]
run = "rumdl check --fix ."

# Zip a skill directory for upload (e.g. to claude.ai), dereferencing any
# symlinks so the archive contains only real files.
# Usage: mise run zip-skill -- /full/path/to/skills/<domain>/<skill-name>
[tasks.zip-skill]
description = "Zip a skill directory for upload, dereferencing symlinks"
run = "./scripts/zip-skill.sh"

[tasks."audit:listing"]
description = "Estimate the shared skill-listing description budget (pass flags after --, e.g. --from-settings)"
run = "pantheon-skill-auditor analyze listing skills"

[tasks."audit:probes"]
description = "Validate the invocation probes, then score them (pass pantheon-skill-auditor probes flags after --)"
run = ["pantheon-skill-auditor probes validate probes", "pantheon-skill-auditor probes score probes"]

[tasks."audit:skill"]
description = "Run the pinned pantheon-skill-auditor (pass skill args after --)"
run = "pantheon-skill-auditor evaluate"

