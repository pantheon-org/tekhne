# TOML formatting. The repository carries a number of hand-maintained TOML
# files (mise.toml, Cargo.toml, dist-workspace.toml, .plumber.yaml's
# siblings) that no formatter currently touches.
#
# Cargo.lock is generated by cargo and must not be reformatted.

exclude = ["Cargo.lock", "target/**", "node_modules/**"]

[formatting]
# Tuned so `taplo fmt --check` is a no-op against the tree as it stands:
# this file records the existing house style rather than demanding a
# reformat. Changing any of these means a formatting commit, so change them
# deliberately.
align_entries = false
align_comments = false
# Four spaces, matching .editorconfig and the existing Cargo.toml. Taplo
# does not read .editorconfig, so the two have to be kept in step by hand.
indent_string = "    "
# Leave long arrays as the author wrote them. Auto-expand would rewrap
# dist-workspace.toml's `targets` for no benefit.
array_auto_collapse = false
array_auto_expand = false
indent_tables = false
# Key order in these files is meaningful to a reader (tool pins grouped by
# purpose, dist config grouped by concern), so leave it alone.
reorder_keys = false
