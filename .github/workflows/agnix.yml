name: agnix

# Lints the skills with agnix (https://github.com/agent-sh/agnix) against Claude
# Code's documented formats: frontmatter fields and values, allowed-tools names,
# broken links and leaked tool-call markup. These are the defect classes fixed in
# #414, which the skill validator and auditor do not check.
#
# Non-blocking for now: findings appear as PR annotations and the job passes.
# Make it blocking (drop continue-on-error) once it has run without false
# positives for a while. Configuration lives in .agnix.toml. Never runs --fix.
#
# No third-party action: the pinned release is downloaded with the preinstalled
# gh CLI, and its GitHub build attestation is verified before it runs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "skills/**"
      - ".agnix.toml"
      - ".github/workflows/agnix.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with "github:agent-sh/agnix" in mise.toml.
  AGNIX_VERSION: "0.55.0"

jobs:
  agnix:
    name: agnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install agnix (attestation verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="agnix-x86_64-unknown-linux-gnu.tar.gz"
          dir="$RUNNER_TEMP/agnix"
          mkdir -p "$dir"
          gh release download "v${AGNIX_VERSION}" -R agent-sh/agnix -p "$asset" -D "$dir"
          gh attestation verify "$dir/$asset" --repo agent-sh/agnix \
            --signer-workflow agent-sh/agnix/.github/workflows/release.yml
          tar -xzf "$dir/$asset" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Lint skills
        continue-on-error: true
        run: |
          agnix --version
          agnix -c .agnix.toml --format github skills
