name: agnix

# Lints the skills with agnix (https://github.com/agent-sh/agnix) against Claude
# Code's documented formats: frontmatter fields and values, allowed-tools names,
# broken links and leaked tool-call markup. These are the defect classes fixed in
# #414, which the skill validator and auditor do not check.
#
# Runs on every push to a pull request and on every push to main.
#
# What fails a pull request: an error the pull request introduces, meaning an
# error whose rule and file are not already an error on the base branch
# (scripts/agnix/introduced-errors.sh). An error already on main is tracked by its
# issue and does not hold up unrelated work. Warnings never fail.
#
# What is tracked (scripts/agnix/file-issues.sh): one issue per error (rule and
# file) and one per warning rule listing every affected file. A pull request that
# flags something opens the issue if it is missing; it never edits or closes one.
# The run on main opens missing issues, refreshes the warning file lists and
# closes issues whose finding is gone. One "## agnix" comment on the pull request
# shows PASS or FAIL, updated in place on each run. Configuration lives in
# .agnix.toml. Never runs --fix.
#
# No third-party action for agnix itself: the pinned release is downloaded from
# its public URL and checked against a pinned SHA-256 before it runs. The digest
# was taken from a tarball whose GitHub build attestation verified against
# agnix's release.yml (gh attestation verify). Verifying the attestation in this
# job is not possible: the job token is scoped to this repository, so gh cannot
# read another repository's releases or attestations ("release not found").
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes the older run; runs on main are all kept so
  # none skips its close step.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with "github:agent-sh/agnix" in mise.toml. On a bump, re-verify
  # the new tarball's attestation locally and replace the digest:
  #   gh attestation verify agnix-x86_64-unknown-linux-gnu.tar.gz --repo agent-sh/agnix \
  #     --signer-workflow agent-sh/agnix/.github/workflows/release.yml
  AGNIX_VERSION: "0.56.6"
  AGNIX_SHA256: "3228e88286c44da93bd591cc6358549c4a3d685b44c9d64625955d668528a155"

jobs:
  agnix:
    name: agnix
    # A fork's token cannot comment or file issues, so forks are skipped (mirrors
    # skill-audit.yml). Pushes to main are always from this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The base branch is linted with the head's config, so a change to the rules
      # is compared like for like and cannot make every old error look new.
      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install agnix (pinned digest)
        run: |
          set -euo pipefail
          asset="agnix-x86_64-unknown-linux-gnu.tar.gz"
          dir="$RUNNER_TEMP/agnix"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$asset" \
            "https://github.com/agent-sh/agnix/releases/download/v${AGNIX_VERSION}/${asset}"
          echo "${AGNIX_SHA256}  $dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"

      # agnix exits 1 when it reports errors; the verdict is read from the JSON
      # instead, so neither run fails this step.
      - name: Lint skills
        run: |
          agnix --version
          agnix -c .agnix.toml --format github skills || true
          agnix -c .agnix.toml --format json skills > agnix.json || true

      - name: Lint the base branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -d base/skills ]; then
            (cd base && agnix -c ../.agnix.toml --format json skills > ../agnix-base.json) || true
          fi

      # Never blocks: a failure here leaves the PR comment and annotations as the
      # only signal. Values reach the script through env, never by being pasted
      # into it.
      - name: File issues for findings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && 'main' || 'pr' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACKED_FILE: tracked-issues.md
        run: bash scripts/agnix/file-issues.sh agnix.json

      # continue-on-error so the comment is still posted; the "Fail" step below
      # turns an introduced error into a failed job once the comment is up.
      - name: Find errors this pull request introduces
        id: gate
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          INTRODUCED_FILE: introduced-errors.txt
        run: bash scripts/agnix/introduced-errors.sh agnix.json agnix-base.json

      # Step data reaches the script through files, never by being pasted into it.
      # Messages are HTML-escaped so a finding cannot inject markup or mentions.
      - name: Assemble comment
        id: comment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          errors=$(jq '.summary.errors' agnix.json)
          warnings=$(jq '.summary.warnings' agnix.json)
          files=$(jq '.files_checked' agnix.json)
          introduced=0
          if [ -s introduced-errors.txt ]; then introduced=$(wc -l < introduced-errors.txt | tr -d ' '); fi
          existing=$((errors - introduced))
          if [ "$introduced" -eq 0 ]; then verdict="PASS"; else verdict="FAIL"; fi
          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/`/\&#96;/g' -e 's/@/\&#64;/g' -e 's/|/\&#124;/g'; }
          {
            echo "## agnix"
            echo
            if [ "$introduced" -eq 0 ]; then
              echo "**${verdict}**: this pull request introduces no errors. agnix ${AGNIX_VERSION} checked ${files} file(s): ${existing} error(s) already on \`main\`, ${warnings} warning(s)."
            else
              echo "**${verdict}**: this pull request introduces ${introduced} error(s). agnix ${AGNIX_VERSION} checked ${files} file(s): ${existing} other error(s) already on \`main\`, ${warnings} warning(s)."
              echo
              echo "| Rule | File |"
              echo "| --- | --- |"
              head -n 50 introduced-errors.txt \
                | while IFS=$'\t' read -r rule file; do
                    printf '| %s | %s |\n' "$(printf '%s' "$rule" | escape)" "$(printf '%s' "$file" | escape)"
                  done
            fi
            echo
            echo "Only an error the pull request introduces fails this check. Errors already on \`main\` and warnings are tracked in GitHub issues and do not. Findings are also shown as annotations on the changed files."
            if [ -s tracked-issues.md ]; then
              echo
              echo "Tracked in:"
              echo
              cat tracked-issues.md
            fi
            if [ "$warnings" -gt 0 ]; then
              echo
              echo "<details><summary>Warnings by rule</summary>"
              echo
              jq -r '[.diagnostics[] | select(.level == "warning") | .rule] | group_by(.) | map("- \(.[0]): \(length)") | .[]' agnix.json
              echo
              echo "</details>"
            fi
          } > comment.md

      - name: Find existing agnix comment
        id: find-comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## agnix"

      - name: Post or update agnix comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: comment.md

      - name: Fail on introduced errors
        if: github.event_name == 'pull_request' && steps.gate.outcome == 'failure'
        run: |
          echo "::error::This pull request introduces agnix errors; see the agnix comment."
          exit 1
