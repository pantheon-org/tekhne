name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      # The parity gates score live skills under skills/**. They assert
      # invariants there rather than pinned output, so a skill edit cannot
      # break them, but a new or malformed skill can still trip one and CI
      # should say so on that PR rather than on somebody else's.
      - "skills/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      # The parity gates score live skills under skills/**. They assert
      # invariants there rather than pinned output, so a skill edit cannot
      # break them, but a new or malformed skill can still trip one and CI
      # should say so on that PR rather than on somebody else's.
      - "skills/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when the ref updates (e.g. a rebase), so
  # stale runs are cancelled instead of piling onto the shared API quota.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners; pin the toolchain to
      # match mise.toml. Keep this version in sync with the `rust` pin there.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1

      # Restores the registry, the git checkouts, and target/ from a cache
      # seeded on main. `save-if` is the important half: without it every
      # pull request writes its own entry and the 10GB per-repository budget
      # thrashes, evicting the entry everything else restores from.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Supply-chain gate: advisories, licences, bans and sources. This
      # replaces `cargo install cargo-audit` followed by `cargo audit`, which
      # compiled the auditor from source on every run and then declined to
      # fail on what it found.
      #
      # A hard gate deliberately, with no continue-on-error. The tree was
      # confirmed clean before this landed (advisories ok, bans ok, licenses
      # ok, sources ok), and the advisory-only posture is precisely how the
      # previous step ended up never blocking anything. See the cargo-deny
      # section of AGENTS.md for what to do when it fails.
      #
      # Advisory coverage is unchanged: cargo-deny reads the same RustSec
      # advisory database cargo-audit did.
      - name: Check dependencies (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
