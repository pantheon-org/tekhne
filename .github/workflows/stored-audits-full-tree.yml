name: Stored Audits Full Tree

# Guardrail for drift that a check on changed skills cannot see: a change to the
# scorer makes every stored audit stale, and two pull requests that each pass can
# combine on main into something neither audit describes. Runs the stored-audit
# check over every skill on each push to main, and on any pull request that changes
# the pinned auditor (mise.toml, mise.lock or the install action), so bumping the
# scorer must refresh the audits it invalidates in the same pull request.
#
# Revisit trigger: if this takes more than 10 minutes, switch it to a scheduled run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/install-skill-auditor/**"
      - ".github/workflows/stored-audits-full-tree.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tree:
    name: Stored Audits Full Tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI installs the auditor from the action's own pin while local hooks use
      # mise, so fail here if mise.toml, mise.lock and the action name different
      # releases (a bump in only one place would test the wrong scorer).
      - name: Check the auditor pin is consistent
        run: bash scripts/stored-audits/check-auditor-pin.sh

      - name: Install skill-auditor
        uses: ./.github/actions/install-skill-auditor

      - name: Check every skill's stored audit
        run: bash scripts/stored-audits/check.sh --all
