name: Skill Audit Gate

# Runs on every PR to main (no path filter) so the required "Skill Audit"
# status check always reports a conclusion. PRs that change no skills are
# detected early and pass immediately without building the Rust tools; a path
# filter here would leave the required check unreported and block non-skill
# PRs forever.
#
# Gate: a skill graded below B blocks only when this pull request made it worse
# (it is new, or scores lower than at the base commit). A skill that is already
# below B and not lowered passes with a warning and is tracked by an issue
# (scripts/skill-audit/classify.sh, file-issues.sh). B and B+ are warnings; A
# and A+ pass.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # Filing a tracking issue for each skill graded below B.
  issues: write

concurrency:
  # Supersede an in-flight run when the ref updates (e.g. a rebase), so
  # stale runs are cancelled instead of piling onto the shared API quota.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-audit:
    name: Skill Audit
    # Fork PRs get a read-only token; skip to avoid comment-permission errors.
    if: github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find changed skill dirs
        id: dirs
        run: |
          # Any change inside a skill (SKILL.md, evals/, references/, scripts/,
          # assets/) re-audits that skill, because the auditor scores all of
          # them. Walk each changed path up to the nearest directory that holds
          # a SKILL.md; paths outside a skill, and deleted skills, are skipped.
          #
          # The toolkit manifest (.tekhne/plugin.json, formerly
          # .tessl-plugin/plugin.json) is ignored: it holds release and docs
          # metadata, the auditor never scores it, and a manifest-only change
          # would otherwise re-audit every skill in the toolkit.
          #
          # Stored audits (.audits/) are ignored too: storing an audit records a
          # result, it does not change the skill, so a pull request that only
          # refreshes audits must not be graded as if it had changed the skill.
          DIRS=$(git diff --name-only --diff-filter=AMDR \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- 'skills/' 2>/dev/null \
            | grep -vE '/\.(tekhne|tessl-plugin)/plugin\.json$|/\.audits/' \
            | while read -r f; do
                d=$(dirname "$f")
                while [ "$d" != "skills" ] && [ "$d" != "." ]; do
                  if [ -f "$d/SKILL.md" ]; then echo "$d"; break; fi
                  d=$(dirname "$d")
                done
              done | sort -u | tr '\n' ' ')
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          [ -n "$DIRS" ] && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: No skills changed
        if: steps.dirs.outputs.found == 'false'
        run: echo "No SKILL.md changed — nothing to audit. Skill Audit passes."

      # skill-auditor bundles its own D1-D9 scoring with the skill-validator-rs
      # structural checks (both crates live in the Rust workspace). Only build
      # from source when there are skills to audit.
      #
      # rustup is preinstalled on GitHub-hosted runners; pin the toolchain to
      # match mise.toml and rust-ci.yml. Keep this version in sync with them.
      - name: Install Rust toolchain
        if: steps.dirs.outputs.found == 'true'
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1

      - name: Build skill-auditor
        if: steps.dirs.outputs.found == 'true'
        run: cargo build --release --locked -p pantheon-skill-auditor

      # Shared skill-listing budget (advisory). Every listing-eligible skill's
      # name and description share one budget in the model's context, so a
      # description added here spends it for every other skill. This is a
      # whole-tree estimate against the documented fallback and the 1% band, so
      # it never fails the job; it lands in the job summary and as a notice.
      - name: Listing budget (advisory)
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          cargo build --release --locked -q -p skill-validator-rs
          target/release/skill-validator-rs analyze listing skills --fraction 0.01 -o markdown > listing.md || exit 0
          { echo "## Skill listing budget"; echo; cat listing.md; } >> "$GITHUB_STEP_SUMMARY"
          target/release/skill-validator-rs analyze listing skills --fraction 0.01 -o json \
            | jq -r '.listing | "::notice title=Skill listing budget::\(.entries | length) skills use \(.total_chars) description chars; budget \(.bands | map("\(.budget_chars) at \(.context_tokens) tokens") | join(", ")). Advisory only."' || true

      # Audit the same skills as they were at the base commit, with the same
      # auditor build, so the two scores compare. Skills that do not exist at the
      # base are left out (they are new). If any of this fails, base.json stays
      # empty and every skill below B blocks, which is the safe answer.
      - name: Audit changed skills at the base commit
        id: base
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo '[]' > base.json
          base="$RUNNER_TEMP/base"
          git worktree add --detach "$base" "${{ github.event.pull_request.base.sha }}" || exit 0
          rels=()
          for dir in ${{ steps.dirs.outputs.dirs }}; do
            rel="${dir#skills/}"
            [ -f "$base/skills/$rel/SKILL.md" ] && rels+=("$rel")
          done
          [ "${#rels[@]}" -gt 0 ] || exit 0
          (cd "$base" && "$GITHUB_WORKSPACE/target/release/pantheon-skill-auditor" batch "${rels[@]}" --json) > base.json.tmp 2>/dev/null \
            && mv base.json.tmp base.json

      # Trigger-phrase drift (advisory). A rewrite can drop a description phrase
      # that auto-invocation relied on while every score stays flat. Compare each
      # changed skill's description with the same skill in the base worktree made
      # above and list the phrases that vanished. It never fails the job: a drop
      # is often a deliberate consolidation, so the comment asks the reviewer to
      # confirm. A skill with no base copy is new and reports nothing. Phrases
      # come from the pull request, so the markup characters are stripped before
      # they reach the comment.
      - name: Trigger phrase drift (advisory)
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          : > drift.md
          cargo build --release --locked -q -p skill-validator-rs || exit 0
          base="$RUNNER_TEMP/base"
          for dir in ${{ steps.dirs.outputs.dirs }}; do
            rel="${dir#skills/}"
            target/release/skill-validator-rs analyze triggers "$dir" --base "$base/skills/$rel" -o json 2>/dev/null \
              | jq -r 'select(.triggers.dropped | length > 0)
                  | "- `\(.triggers.skill_dir | sub("^skills/"; "") | gsub("[`<>@&|]"; ""))`: "
                    + (.triggers.dropped | map("`" + gsub("[`<>@&|]"; "") + "`") | join(", "))' >> drift.md || true
          done
          [ -s drift.md ] && echo "::notice title=Trigger phrase drift::$(wc -l < drift.md) changed skill(s) dropped description trigger phrases. Advisory only; see the Skill Audit comment." || true

      # Cross-skill duplication scan over the whole skills/ tree. Advisory here:
      # skill families legitimately share structure (the tree-wide maximum today
      # is ~54% similarity), so a hard tree-wide gate would be permanently red.
      # Instead this only warns when a skill *changed in this PR* is involved in
      # a high-similarity (>=70%) pair — the signal for an accidental copy-paste
      # of an existing skill. The JSON artifacts feed the PR-comment step.
      - name: Duplication check (advisory)
        id: dup
        if: steps.dirs.outputs.found == 'true'
        run: |
          set -euo pipefail
          target/release/pantheon-skill-auditor duplication skills --threshold 70 --json > duplication.json || echo '[]' > duplication.json
          changed=$(for dir in ${{ steps.dirs.outputs.dirs }}; do basename "$dir"; done | sort -u | jq -R . | jq -cs .)
          jq -c --argjson names "$changed" \
            '[.[] | select((.name1 as $a | $names | index($a)) or (.name2 as $b | $names | index($b)))]' \
            duplication.json > duplication-relevant.json
          n=$(jq 'length' duplication-relevant.json)
          echo "relevant=$n" >> "$GITHUB_OUTPUT"
          # Render a Markdown summary for the PR comment (surfaced in the
          # "Cross-skill duplication" details block of the Skill Audit comment).
          {
            echo "summary<<DUP_EOF"
            if [ "$n" -gt 0 ]; then
              echo "**${n} high-similarity (>=70%) pair(s) involving a skill changed in this PR** — check for accidental copy-paste:"
              echo ""
              echo "| Skill A | Skill B | Similarity | Common lines |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| `\(.name1)` | `\(.name2)` | \(.similarity)% | \(.common_lines) |"' duplication-relevant.json
            else
              echo "No high-similarity (>=70%) pairs involving skills changed in this PR."
            fi
            echo "DUP_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then
            echo "::warning::${n} high-similarity (>=70%) skill pair(s) involve a skill changed in this PR — check for accidental copy-paste. Advisory only; see the Skill Audit comment."
          fi

      # Consolidated grade audit via a single `batch` call (replaces a per-skill
      # `evaluate` loop). A grade below B (C+, C, D, F) fails the gate; B and B+
      # are non-blocking warnings; A and A+ pass. A skill missing from the JSON
      # (audit error) counts as a failure too.
      - name: Audit changed skills
        id: audit
        if: steps.dirs.outputs.found == 'true'
        run: |
          set -euo pipefail
          rels=()
          for dir in ${{ steps.dirs.outputs.dirs }}; do
            rels+=("${dir#skills/}")
          done
          target/release/pantheon-skill-auditor batch "${rels[@]}" --json > batch.json || echo '[]' > batch.json
          [ -f base.json ] || echo '[]' > base.json
          bash scripts/skill-audit/classify.sh batch.json base.json > verdict.json
          # The per-skill detail blocks are cosmetic. They come from a second
          # run so that nothing in that path can change batch.json, the table or
          # `fail` above. A failure here leaves an empty file, never a red job.
          target/release/pantheon-skill-auditor batch "${rels[@]}" --json --details-markdown details.md > /dev/null 2>&1 || : > details.md
          [ -f details.md ] || : > details.md
          rows=$(jq -r '
            .[]
            | (if .tier == "pass" then "✅ pass"
               elif .tier == "warn" then "⚠️ warning"
               elif .tier == "debt" then "⚠️ below B, not lower than base (tracked)"
               else "❌ fail (" + .reason + ")" end) as $tier
            | "| `\(.skill)` | \(.grade) | \(.total)/\(.maxTotal) | \(if .baseTotal == null then "new" else (.baseTotal | tostring) end) | \($tier) |"
          ' verdict.json)
          fail=$(jq '[.[] | select(.tier == "fail")] | length' verdict.json)
          debt=$(jq '[.[] | select(.tier == "debt")] | length' verdict.json)
          got=$(jq 'length' batch.json)
          want=${#rels[@]}
          if [ "$got" -lt "$want" ]; then
            fail=$((fail + want - got))
          fi
          # Skills that were asked for but did not come back, one per line, for
          # the comment. Written to a file, not GITHUB_OUTPUT, because the names
          # come from the PR; this does not feed `fail`, and a failure here
          # leaves an empty list rather than failing the step.
          {
            jq -r '.[] | (.skill | sub(".*/skills/"; "") | sub("/SKILL.md$"; ""))' batch.json > scored.txt
            for rel in "${rels[@]}"; do
              grep -qxF -- "$rel" scored.txt || printf '%s\n' "$rel"
            done > unscored.txt
          } || : > unscored.txt
          {
            echo "table<<AUDIT_EOF"
            printf '| Skill | Grade | Score | Base | Tier |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '%s\n' "$rows"
            echo "AUDIT_EOF"
            echo "fail=$fail"
            echo "debt=$debt"
          } >> "$GITHUB_OUTPUT"

      # Keep one open issue per skill that is below B but was not lowered by this
      # pull request (known debt) and link it here (scripts/skill-audit/
      # file-issues.sh). A skill this pull request made worse blocks instead and
      # gets no issue. It never decides the gate: "Enforce gate" below does that,
      # so a failure here is a warning, not a red check.
      - name: File issues for known-debt skills
        if: steps.dirs.outputs.found == 'true' && steps.audit.outputs.debt != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/skill-audit/file-issues.sh verdict.json

      # The audit comment is cosmetic. Never let a transient comment-API
      # failure (e.g. installation-token rate limit) fail the required gate —
      # the verdict is decided by "Enforce gate" from the grade alone.
      - name: Find existing audit comment
        id: find-comment
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Skill Audit"

      # The whole comment is built into one file so its total size can be
      # checked (GitHub rejects comments over 65,536 characters; the limit here
      # is lower and counted in bytes, which is stricter). Step outputs reach the
      # script through env, never by being pasted into it. If the comment is too
      # big, the per-skill detail is dropped and the table stays.
      - name: Assemble audit comment
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        env:
          TABLE: ${{ steps.audit.outputs.table }}
          DUP_SUMMARY: ${{ steps.dup.outputs.summary }}
          MAX_COMMENT_BYTES: "60000"
        run: |
          set -euo pipefail
          escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/`/\&#96;/g' -e 's/@/\&#64;/g'
          }
          build() {
            printf '## Skill Audit\n\n%s\n\n' "$TABLE"
            printf '**Gate:**\n- ✅ pass = A / A+ (≥126)\n- ⚠️ warning = B – B+ (112–125, non-blocking)\n- ⚠️ below B, not lower than base = known debt (non-blocking, tracked by an issue)\n- ❌ fail = below B (<112) and either a new skill or scoring lower than on the base branch (blocks merge)\n\n'
            if [ -s unscored.txt ]; then
              printf 'Not scored (the audit could not read them): '
              escape < unscored.txt | awk '{ printf "%s<code>%s</code>", (NR > 1 ? ", " : ""), $0 } END { print "" }'
              printf '\n'
            fi
            if [ -s tracked-issues.md ]; then
              printf '**Tracking issues** (one open issue per skill below B that this pull request did not lower, filed automatically):\n\n'
              cat tracked-issues.md
              printf '\n'
            fi
            if [ -s drift.md ]; then
              printf '**Dropped trigger phrases** (advisory; confirm the description still names each intent, or restore the phrase):\n\n'
              cat drift.md
              printf '\n'
            fi
            if [ "$1" = 1 ] && [ -s details.md ]; then
              printf '**Where the points were lost** (the three biggest losses for each skill graded below A):\n\n'
              cat details.md
              printf '\n'
            fi
            printf '<details>\n<summary>Cross-skill duplication (advisory)</summary>\n\n%s\n\n</details>\n' "$DUP_SUMMARY"
          }
          build 1 > comment.md
          if [ "$(wc -c < comment.md)" -gt "$MAX_COMMENT_BYTES" ]; then
            echo "::warning::Skill Audit comment is over ${MAX_COMMENT_BYTES} bytes; posting without the per-skill detail."
            build 0 > comment.md
          fi

      - name: Post audit comment
        if: steps.dirs.outputs.found == 'true'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: comment.md

      - name: Enforce gate (fail below B)
        if: steps.dirs.outputs.found == 'true' && steps.audit.outputs.fail != '0'
        run: |
          echo "::error::One or more changed skills are below B and either new or scoring lower than on the base branch, or could not be audited. Raise them to at least grade B (112/140), or at least back to their base score, to pass. A skill already below B that this pull request did not lower passes and is tracked by an issue."
          exit 1
