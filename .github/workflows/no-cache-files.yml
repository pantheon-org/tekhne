name: No Cache Files

# Guardrail: fail if a cache or dependency folder (.terragrunt-cache, .terraform,
# __pycache__, .pytest_cache, node_modules, .cache, .venv) is tracked. These are
# generated by running a tool, not authored. This promotes the pre-commit
# `no-cache-files` hook (hk.pkl) to a CI gate, so a commit that skipped the local
# hook (--no-verify, the web editor, a bot) cannot land one. .gitignore stops the
# usual accident; this stops a forced add.
#
# The script is deterministic and offline: no build, no network. No path filter, so
# the check always reports a conclusion (mirrors python-allowlist.yml); a cache
# folder can appear anywhere, not only under skills/. Also runs on push to main as
# a post-merge safety net.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when the ref updates (e.g. a rebase), so
  # stale runs are cancelled instead of piling onto the shared API quota.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-cache-files:
    name: No Cache Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check no cache folders are tracked
        run: bash scripts/check-no-cache-files.sh --tracked
