# zizmor rule configuration.
#
# Every entry here is a finding that exists today and is NOT being fixed in
# the commit that introduced the gate. They are listed so the gate blocks new
# problems from now on rather than waiting on a backlog. Each says why it is
# here and what would clear it. Adding to this file should be rare and
# argued; the default answer to a zizmor finding is to fix the workflow.

rules:
  excessive-permissions:
    ignore:
      # dist owns and regenerates tool-release.yml ("This file was
      # autogenerated by dist"), so a hand-edit here is reverted on the next
      # `dist init`. Clearing this means either a cargo-dist config knob or
      # accepting the workflow-level grant. Tracked as an open question on
      # the CI hardening plan.
      - tool-release.yml

  template-injection:
    ignore:
      # Same generated file. The expansion is dist's own
      # `github.ref_name` interpolation in its release command; the value is
      # a tag name on this repository, not attacker-supplied, and the
      # workflow only runs on tag push.
      - tool-release.yml

  unpinned-images:
    ignore:
      # Same generated file. Low confidence: the container reference is a
      # matrix value that is null for every target this repository builds.
      - tool-release.yml

  github-app:
    ignore:
      # actions/create-github-app-token without permission-<name> inputs
      # yields a token with the App installation's full permissions. Both
      # workflows are release-critical (auto-rebase and release automerge),
      # so narrowing the token needs its own change with a real test rather
      # than riding along with the gate. Genuine finding, deliberately
      # deferred.
      - pr-auto-rebase.yml
      - release-automerge.yml
